stages:
  - validate
  - compile
  - test
  - package

# -------------------------
# OPENAPI VALIDATION
# -------------------------

validate-openapi:
  stage: validate
  image: node:22
  script:
    - npm install --global @redocly/cli
    - redocly lint api/flight-service.yml api/hotel-service.yml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'


# -------------------------
# FLIGHT SERVICE
# -------------------------

flight-compile:
  stage: compile
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd flight-service
    - chmod +x mvnw
    - ./mvnw clean compile -B
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'


flight-test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd flight-service
    - chmod +x mvnw
    - ./mvnw test -B
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  artifacts:
    name: "flight test artifacts"
    when: always
    paths:
      - flight-service/target/surefire-reports/
    reports:
      junit: flight-service/target/surefire-reports/TEST-*.xml

flight-package:
  stage: package
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd flight-service
    - chmod +x mvnw
    - ./mvnw package -DskipTests -B
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  artifacts:
    name: "flight jar artifacts"
    paths:
      - flight-service/target/*.jar


# -------------------------
# HOTEL SERVICE
# -------------------------

hotel-compile:
  stage: compile
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd "hotel-service"
    - chmod +x mvnw
    - ./mvnw clean compile -B
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

hotel-test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd "hotel-service"
    - chmod +x mvnw
    - ./mvnw test -B
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  artifacts:
    name: "hotel test artifacts"
    when: always #per default only saves successes
    paths:
      - hotel-service/target/surefire-reports/
    reports:
      junit: hotel-service/target/surefire-reports/TEST-*.xml

hotel-package:
  stage: package
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd "hotel-service"
    - chmod +x mvnw
    - ./mvnw package -DskipTests -B
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  artifacts:
    name: "hotel jar artifacts"
    paths:
      - hotel-service/target/*.jar
