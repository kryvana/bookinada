
stages:
  - validate
  - compile
  - test
  - package

# -------------------------
# OPENAPI VALIDATION
# -------------------------

validate-openapi:
  stage: validate
  image: node:22
  script:
    - npm install --global @redocly/cli
    - redocly lint openapi.yaml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'


# -------------------------
# FLIGHT SERVICE
# -------------------------

flight-compile:
  stage: compile
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd flight-service
    - chmod +x mvnw
    - ./mvnw clean compile -B
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

flight-test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd flight-service
    - chmod +x mvnw
    - ./mvnw test -B
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

flight-package:
  stage: package
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd flight-service
    - chmod +x mvnw
    - ./mvnw package -DskipTests -B
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'


